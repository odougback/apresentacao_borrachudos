<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Borrachudos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="presentation">

    <div class="slides" id="slides">
      <div class="slide active"><img src="img/01 - Capa.png" alt="Capa"></div>
      <div class="slide"><img src="img/02 - Ciclo de Vida.png" alt="Ciclo de Vida"></div>
      <div class="slide"><img src="img/03 - Criadouros.png" alt="Criadouros"></div>
      <div class="slide"><img src="img/04 -Por que controlar.png" alt="Por que controlar"></div>
      <div class="slide"><img src="img/05 - Metodo de controle.png" alt="Método de controle"></div>
      <div class="slide"><img src="img/06 - BTI.png" alt="BTI"></div>
      <div class="slide"><img src="img/07 - Modo de açao do BTI.png" alt="Modo de ação do BTI"></div>
      <div class="slide"><img src="img/08 - DOSE DE BTI.png" alt="Dose de BTI"></div>
      <div class="slide"><img src="img/09 - regadores 3.png" alt="Regadores"></div>
      <div class="slide"><img src="img/10 - aplicacao 2.png" alt="Aplicação"></div>
      <div class="slide"><img src="img/11 - Fatores variaveis.png" alt="Fatores variáveis"></div>
      <div class="slide"><img src="img/12 - carreamento.png" alt="Carreamento"></div>
      <div class="slide"><img src="img/13 - Analise comparativo.png" alt="Análise comparativa 1"></div>
      <div class="slide"><img src="img/14 - Analise comparativo.png" alt="Análise comparativa 2"></div>
      <div class="slide"><img src="img/15 - Consideracoes.png" alt="Considerações finais"></div>
      <div class="slide"><img src="img/16 - Obrigado.png" alt="Obrigado"></div>
    </div>

    <button class="nav-btn nav-prev" id="prevBtn" aria-label="Anterior">‹</button>
    <button class="nav-btn nav-next" id="nextBtn" aria-label="Próximo">›</button>

    <div class="counter">
      <span id="currentSlide">1</span> / <span id="totalSlides">16</span>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Tela cheia">⛶</button>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="dots" id="dots"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
